services:
  slides:
    build:
      context: .
    image: "${APP_NAME:-iac-presentation}:local"
    container_name: "${CONTAINER_NAME:-iac-slides}"
    restart: "${RESTART_POLICY:-unless-stopped}"
    environment:
      CONTAINER_PORT: "${CONTAINER_PORT:-8000}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:${CONTAINER_PORT:-8000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
